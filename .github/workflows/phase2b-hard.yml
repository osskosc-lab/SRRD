name: SRRD Phase 2B-hard smoke

on:
  pull_request:
    paths:
      - 'src/srrd_phase2b_hard/**'
      - 'run_phase2b_hard.py'
      - 'scripts/verify_phase2b_hard.py'
      - 'preregistration/phase2b_hard*'
      - 'tests/test_phase2b_hard.py'
      - 'requirements.txt'
      - '.github/workflows/phase2b-hard.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (smoke or development; confirmatory should be run deliberately after review)'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, development]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Phase 2B-hard
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'smoke' }}"
          python run_phase2b_hard.py --mode "$MODE" --output "results/phase2b_hard_${MODE}"
          python scripts/verify_phase2b_hard.py --mode "$MODE" --results "results/phase2b_hard_${MODE}"
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: srrd-phase2b-hard-audit
          path: results/phase2b_hard_*
